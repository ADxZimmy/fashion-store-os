<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fashion Studio OS</title>
    <link rel="icon" href="src/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="src/styles.css">
  </head>
  <body>
    <div id="app"></div>
    <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true" hidden></div>
    <!-- Device storage must define window.FsoStorage before the app reads it.
         Both are deferred, so they run in document order. -->
    <script src="src/storage.js" defer></script>
    <script src="src/backup.js" defer></script>
    <script src="src/app.js" defer></script>
  </body>
</html>
